name: "下载或登录时卡住或失败"
description: "下载游戏、Mod 或整合包，或登录正版账号时出现问题"
labels: [· Bug, 新提交]
body:
- type: checkboxes
  id: "yml-1"
  attributes:
    label: "检查项"
    description: "请逐个检查下列项目，并勾选确认。"
    options:
    - label: "我已说明相同网络环境下其他启动器的表现，或说明无法对比的原因。"
      required: false
    - label: "我已检查网络环境，并附上 CPT 的具体错误提示，不会提供密码、访问令牌或其他凭据。"
      required: true
    - label: "我已搜索本 CPT 仓库的已有反馈，确认没有重复问题，并知晓 CPT 问题由 HUASQ 处理。"
      required: true
- type: textarea
  id: "yml-2"
  attributes:
    label: 描述
    description: "详细描述该 Bug 的具体表现。"
  validations:
    required: true
- type: textarea
  id: "yml-3"
  attributes:
    label: 重现步骤
    description: "详细描述要怎么操作才能再次触发这个 Bug。"
    value: |
      1、点击xxxx
      2、往下滚，然后点击xxxx
  validations:
    required: true
- type: textarea
  id: "yml-4"
  attributes:
    label: 日志与附件
    description: "上传 CPT 程序旁 PCL 文件夹中的 Log1~5.txt；请遮盖账号、令牌、密码和私人服务器地址。"
    placeholder: "先点击这个文本框，然后再将文件直接拖拽到文本框中以上传。"
  validations:
    required: true
